<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>TSA scan</title>
    </head>
    <body>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                background-color: #e5e5e5;
            }

            .scan-container {
                position: relative;
                width: 100%;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .scan-wrapper {
                position: relative;
                display: inline-block;
            }

            .scan-image {
                display: block;
                max-height: 100vh;
                width: auto;
            }

            .hotspot {
                position: absolute;
                cursor: pointer;
            }

            .hotspot:not([data-invisible]){
                border: 2px solid transparent;
            }

            .hotspot:not([data-invisible]):hover {
                border: 2px solid #00ff;
            }

            .scan-container.show-hotspots .hotspot {
                border: 2px solid red !important;
                box-shadow: 0 0 15px red;
            }

            .overlay {
                display:none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.8);
                justify-content: center;
                align-items: center; 
            }

            .overlay-image {
                max-width: 80%;
                max-height: 80%;
            }

            .close {
                float: right;
                cursor: pointer;
                font-size: 20px;
            }
        </style>
        
        <div class="scan-container">

                <img src="Artboard 2.png" class="scan-image">

                <div class="hotspot"
                    style = "top: 7%; left: 51%; width: 10%; height: 20%;"
                    data-image = "Artboard 3.png"> <!--Octopus .png-->
                </div>
                <div class="hotspot"
                    data-invisible= "true"
                    style = "top: 22.5%; left: 4.6%; width: 13.2%; height: 3%;"
                    data-image = "Artboard 3.png">
                </div>

                <div class="hotspot" 
                    style = "top: 9%; left: 31.5%; width: 10.1%; height: 14%;"
                    data-image = "Pescado.dsc.png">
                </div>
                <div class="hotspot"
                    data-invisible= "true"
                    style = "top: 18.3%; left: 4.6%; width: 13.2%; height: 3%;"
                    data-image = "Pescado.dsc.png">
                </div>
            
                <div class="hotspot" 
                    style = "top: 24%; left: 27.5%; width: 11%; height: 18%;"
                    data-image = "Cabeza.dsc.png">
                </div>
                <div class="hotspot" 
                    data-invisible= "true"
                    style = "top: 14.5%; left: 4.6%; width: 13.2%; height: 3%;"
                    data-image = "Cabeza.dsc.png">
                </div>

                <div class="hotspot" 
                    style = "top: 29%; left: 50.8%; width: 9.4%; height: 13%;"
                    data-image = "T-rex.png"> <!--Huevo.png-->
                </div>
                <div class="hotspot" 
                    data-invisible= "true"
                    style = "top: 26.4%; left: 4.6%; width: 13.2%; height: 3%;"
                    data-image = "T-rex.png"> <!--Huevo2.png-->
                </div>

                <div class="hotspot" 
                    style = "top: 16%; left: 46%; width: 5%; height: 20%;"
                    data-image = "T-Rex.dsc.png">
                </div>
                <div class="hotspot" 
                    data-invisible= "true"
                    style = "top: 30.2%; left: 4.6%; width: 13.2%; height: 3%;"

                </div>

                <div class="hotspot" 
                    style = "top: 54%; left: 39.2%; width: 12.6%; height: 13%;"

                </div>
                <div class="hotspot"
                    data-invisible= "true"

                </div>

                <div class="hotspot" 
                    style = "top: 69%; left: 37.2%; width: 11.7%; height: 15%;"

                <div class="hotspot" 
                    data-invisible= "true"

                </div>

                <div class="hotspot" 
                    style = "top: 70.5%; left: 64%; width: 8%; height: 11%;"

                <div class="hotspot"
                    data-invisible= "true"

                    style = "top: 53.6%; left: 58%; width: 12%; height: 17%;"

                <div class="hotspot"
                    data-invisible= "true"
                    style = "top: 69.8%; left: 80.3%; width: 13.4%; height: 3%;"
                    data-image = "MarbleRun.dsc.png">
                </div>

                <!--Lower Buttons-->
                    <!--Go back button-->
                <div class="hotspot"
                    data-invisible= "true"
                    style = "top: 91%; left: 0.8%; width: 5.4%; height: 8%"
                    onclick="closeTab()">
                </div>
                    <!--Scan Bags button-->
                <div class="hotspot"
                    data-invisible= "true"
                    style = "top: 91%; left: 8.3%; width: 5.4%; height: 8%;"
                    data-action="scan">
                </div>
                    <!--Help Button-->
                <div class="hotspot"
                    data-invisible= "true"
                    style = "top: 91%; left: 15.5%; width: 5.4%; height: 8%;"
                    data-image = "Help.png">
                </div>
            </div>
        </div>

        <div class="overlay" id="overlay">
            <img id="overlay-image" class="overlay-image">
        </div>

        <script>
            const hotspots = document.querySelectorAll(".hotspot");
            const overlay = document.getElementById("overlay");
            const overlayImage = document.getElementById("overlay-image");
            
            hotspots.forEach(hotspot => {

                const isInvisible = hotspot.dataset.invisible;

                if (!isInvisible) {
                        hotspot.addEventListener("mouseenter", () => {
                        hotspot.style.boxShadow = "0 0 15px cyan";
                    });

                        hotspot.addEventListener("mouseleave", () => {
                        hotspot.style.boxShadow = "none";
                    });
                }

                hotspot.addEventListener("click", () => {

                    if (hotspot.dataset.action === "scan"){
                        const container = document.querySelector(".scan-container");

                        container.classList.add("show-hotspots");

                        setTimeout(() => {
                            container.classList.remove("show-hotspots");
                        }, 5000); /*Milisegundos*/

                        return;
                    }

                    if(hotspot.dataset.link){
                        window.location.href = hotspot.dataset.link;
                        return;
                    }

                    overlay.style.display = "flex";
                    overlayImage.src = hotspot.dataset.image;
                });

            });


            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) {
                    overlay.style.display ="none";
                }
            });

            overlayImage.addEventListener("click", (e) => {
                const rect = overlayImage.getBoundingClientRect();

                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const xPercent = x / rect.width;
                const yPercent = y / rect.height;

                const closeZoneXStart = 0.98;
                const closeZoneYEnd = 0.04;

                if (xPercent >= closeZoneXStart && yPercent <= closeZoneYEnd){
                    overlay.style.display = "none";
                }
            });

            overlayImage.addEventListener("mousemove", (e) => {
                const rect = overlayImage.getBoundingClientRect();

                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const xPercent = x / rect.width;
                const yPercent = y / rect.height;

                const closeZoneXStart = 0.98;
                const closeZoneYEnd = 0.04;

                if (xPercent >= closeZoneXStart && yPercent <= closeZoneYEnd){
                    overlayImage.style.cursor ="pointer";
                } else {
                    overlayImage.style.cursor="default";
                }
            });

            function closeTab() {
                window.close();
            }

        </script>
    </body>
</html>
