<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Old TV</title>

        <style>
            body {
                margin: 0;
                background: black;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                overflow: hidden;
            }

            .scene {
                position: relative;
                width: 100vw;
                height: 100vh;
            }

            .tv-wrapper {
                position: absolute;
                top: 40%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw;
            }

            .tv-frame {
                display: block;
                width: 100%;
                height: auto;
                position: relative;
                z-index: 2;
            }

            .screen {
                position: absolute;
                top: 42%;
                left: 38%;
                width: 24%;
                aspect-ratio: 4 / 3;
                overflow: hidden;
                border-radius: 50px;
                z-index: 1;
            }

            #tvVideo {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: brightness(0.85) contrast(1.1);
            }

            .crt-overlay{
                position: absolute;
                inset: 0;
                pointer-events: none;

                background: 
                    repeating-linear-gradient(
                        to bottom,
                        rgba(0,0,0,0.2),
                        rgba(0,0,0,0.2) 2px,
                        transparent 2px,
                        transparent 4px
                    );

                    mix-blend-mode: multiply;
            }

            .channel-list {
                position:absolute;
                top: 50%;
                left: 3vw;
                    /* 50% = centro pantalla
                    -400px = distancia hacia la tv
                    -200px = ancho del panel */
                transform: translateY(-50%);
                background: rgba(0,0,0,0.85);
                padding: 20px;
                width: 29vw;
            }

            .channel {
                cursor:pointer;
                font-size: clamp(18px, 2.5vw, 50px);
                letter-spacing: 2.5px;
                transition: 0.3s ease;
            }

            .channel:hover {
                font-size: clamp(22px, 3vw, 60px);
                font-weight: bold;
            }

            .info-panel {
                position: absolute;
                top: 50%;
                right: 2vw;
                transform: translateY(-50%);
                background: rgba(0,0,0,0.85);
                padding: 2vw;
                width: 18vw;
            }

            .info-panel h2 {
                font-size: 1.8vw;
            }

            .info-panel p {
                opacity: 0.7;
                font-size: 1.3vw;
            }

            .instruction-card {
                position: absolute;
                background: rgba(0,0,0,.87);
                padding: 20px;
                width: 300px;
            }

            .instruction-card h2 {
                font-size: 21px;
                margin: 0;
                opacity: 0.9;
                letter-spacing: .4px;
            }

            .close-zone {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 120px;   /* ajusta tamano si quieres */
                height: 120px;
                background-color: black;
                background-image: url("GoBackArrow.png"); /* tu imagen */
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center;
                cursor: pointer;
                z-index: 999;
            }

        </style>
    </head>

    <body>
        <div class="scene">
            <div class="tv-wrapper">

                <div class="screen">
                    <video id="tvVideo" autoplay muted loop></video>
                    <div class="crt-overlay"></div>
                </div>

                <img src="OldTVNoScreen.png" class="tv-frame">

            </div>

            <div class="channel-list">
                <div class="channel" data-video="vid1">METRONOME</div>
                <div class="channel" data-video="vid2">BRICK</div>
                <div class="channel" data-video="vid3">LOVE LETTER</div>
                <div class="channel" data-video="vid4">TRIP MONTAGE</div>
                <div class="channel" data-video="vid5">BEACH TRIP</div>
            </div>

            <div class="info-panel">
                <h2 id="title">Select a channel</h2>
                <p id="description">Hover over a project to preview it.</p>
            </div>

            <div class="instruction-card" style="
                top: 8vh;
                left: 3vw;
                transform: translateY(-50%);">
                
                <h2>Hover over a project to preview it.</h2>
            </div>

            <div class="instruction-card" style="
                top: 8vh;
                left: 35vw;
                transform: translateY(-50%);">
                
                <h2>Click to open the complete video on YouTube.</h2>
            </div>
            <div class="close-zone"></div>

        </div>

        </body>

        <script>
            const tvVideo = document.getElementById("tvVideo");
            const title = document.getElementById("title");
            const description = document.getElementById("description");

            const videos = {
                vid1 : {
                    file: "MetronomeTeaser.mp4",
                    youtube: "https://youtu.be/-8_Io38zERo?si=IDCoFXjXtHPtfCTh",
                    title: "Metronome",
                    description: "This is a short student film based on the idea of a metronome and a serial killer's obsession with it. I both acted and edited this film."
                },

                vid2 : {
                    file: "brick.mp4",
                    youtube: "https://youtu.be/bn5LqELp5jk?si=KoKBUlkdYXt6P0km",
                    title: "Brick",
                    description: "This is a short student film based on the idea of a fight scene. I was in charge of the cinematography both when filming and editing."
                },

                vid3 : {
                    file: "LoveLetter.mp4",
                    youtube: "https://youtu.be/jiSK7_QJAno?si=p7b3tXix649-55ys",
                    title: "Love letter",
                    description: "This is a stop-motion, Wes Anderson inspired short film that I directed and edited."
                },

                vid4 : {
                    file: "TripMontage.mp4",
                    youtube: "https://youtu.be/BThqY2juhtE?si=6pHV684M2W-Iwxd9",
                    title: "Trip Montage",
                    description: "This is a montage of my backpacking trip from my gap year. I filmed and edited the short film."
                },

                vid5 : {
                    file: "BeachTrip.mp4",
                    youtube: "https://youtu.be/KvhulVlpyvA?si=xEwDWWFDtfJIqkAY",
                    title: "Beach Trip",
                    description: "This is a small montage of a beach trip I took with my brother to Puerto Escondido, Oaxaca. I filmed and edited it, but I'm most proud of the cinematography.."
                }
            };

            function changeChannel(key){
                tvVideo.src = videos[key].file;
                title.textContent = videos[key].title;
                description.textContent = videos[key].description;
            }

            function goToYoutube(key){
                window.open(videos[key].youtube, "_blank");
            }

            document.querySelectorAll(".channel").forEach(channel => {
                channel.addEventListener("mouseenter", () => {
                    changeChannel(channel.dataset.video);
                });

                channel.addEventListener("click", () => {
                    goToYoutube(channel.dataset.video);
                });
            });

            changeChannel("vid1");

            document.querySelector(".close-zone").addEventListener("click", () => {
                window.close();
            });

        </script>

</html>
